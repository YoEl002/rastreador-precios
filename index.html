<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Precios - Panasonic Lumix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-4 px-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📷</span>
                <h1 class="text-lg md:text-xl font-bold tracking-tight text-amber-400">Rastreador Lumix</h1>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Sistema Activo
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        
        <div class="flex space-x-2 border-b border-slate-800 pb-4">
            <button onclick="cambiarPestana('grafica')" id="btn-grafica" class="px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20">
                📊 Gráfica Interactiva
            </button>
            <button onclick="cambiarPestana('tabla')" id="btn-tabla" class="px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800">
                📋 Historial en Tabla
            </button>
        </div>

        <div id="seccion-grafica" class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <h2 class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-1">Producto Monitoreado</h2>
                <p class="text-xl md:text-2xl font-bold text-white mb-4">Panasonic LUMIX (Amazon.es)</p>
                
                <div class="flex flex-wrap gap-4 items-center justify-between pt-4 border-t border-slate-800/80">
                    <div class="text-xs text-slate-400">
                        🕒 Datos leídos directamente desde tu CSV en GitHub
                    </div>
                    <a href="https://www.amazon.es/dp/B01NCTOKPM" target="_blank" class="inline-flex items-center px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-all shadow-md shadow-amber-500/20">
                        Ver en Amazon &rarr;
                    </a>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                    <h3 class="text-base font-semibold text-slate-200">Evolución de Precio Dinámica</h3>
                </div>
                <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800/50 relative h-72 md:h-96">
                    <canvas id="graficaPrecios"></canvas>
                </div>
            </div>
        </div>

        <div id="seccion-tabla" class="hidden space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-base font-semibold text-slate-200 mb-4 border-b border-slate-800 pb-3">Registros del Archivo CSV</h3>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="py-3 px-4 rounded-l-lg">Fecha y Hora</th>
                                <th class="py-3 px-4 rounded-r-lg">Precio Registrado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-cuerpo" class="divide-y divide-slate-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Panel impulsado por GitHub Pages, Chart.js y Python.</p>
    </footer>

    <script>
        function cambiarPestana(tipo) {
            const btnGrafica = document.getElementById('btn-grafica');
            const btnTabla = document.getElementById('btn-tabla');
            const secGrafica = document.getElementById('seccion-grafica');
            const secTabla = document.getElementById('seccion-tabla');

            if (tipo === 'grafica') {
                secGrafica.classList.remove('hidden');
                secTabla.classList.add('hidden');
                btnGrafica.className = "px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20";
                btnTabla.className = "px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800";
            } else {
                secGrafica.classList.add('hidden');
                secTabla.classList.remove('hidden');
                btnTabla.className = "px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20";
                btnGrafica.className = "px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800";
            }
        }

        // Leer el CSV y construir la tabla y la gráfica interactiva
        Papa.parse("historial_precios.csv", {
            download: true,
            header: true,
            complete: function(results) {
                const datosValidos = results.data.filter(row => row.Fecha && row.Precio);
                
                const fechas = datosValidos.map(row => row.Fecha);
                const precios = datosValidos.map(row => parseFloat(row.Precio));

                // 1. Rellenar la tabla
                const tbody = document.getElementById('tabla-cuerpo');
                tbody.innerHTML = "";
                [...datosValidos].reverse().forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/50 transition-colors";
                    tr.innerHTML = `
                        <td class="py-3 px-4">${row.Fecha}</td>
                        <td class="py-3 px-4 font-semibold text-amber-400">${row.Precio} €</td>
                    `;
                    tbody.appendChild(tr);
                });

                // 2. Crear la gráfica interactiva con Chart.js
                const ctx = document.getElementById('graficaPrecios').getContext('2d');
                
                // Color dinámico: si el último precio es menor o igual que el anterior, verde; si sube, rojo
                let colorLinea = '#10b981'; // Verde por defecto
                if (precios.length >= 2) {
                    if (precios[precios.length - 1] > precios[precios.length - 2]) {
                        colorLinea = '#ef4444'; // Rojo si ha subido
                    }
                }

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: fechas,
                        datasets: [{
                            label: 'Precio (€)',
                            data: precios,
                            borderColor: colorLinea,
                            backgroundColor: colorLinea + '20',
                            borderWidth: 3,
                            pointBackgroundColor: colorLinea,
                            pointRadius: 5,
                            pointHoverRadius: 8,
                            fill: true,
                            tension: 0.2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#94a3b8', font: { size: 10 } },
                                grid: { color: '#1e293b' }
                            },
                            y: {
                                ticks: { 
                                    color: '#94a3b8',
                                    callback: function(value) { return value + ' €'; }
                                },
                                grid: { color: '#1e293b' }
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
