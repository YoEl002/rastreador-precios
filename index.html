<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Precios - Panasonic Lumix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 shadow-md">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-amber-400">📷 Rastreador de Precios Lumix</h1>
            <p class="text-sm text-slate-400 mt-1">Monitoreo automático diario desde Amazon España</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">Evolución Histórica</h2>
            
            <div class="flex justify-center items-center bg-slate-900 rounded-lg p-2 overflow-hidden">
                <img src="grafico_precios.png" alt="Gráfica de evolución de precios de la Lumix" class="w-full h-auto rounded-md object-contain">
            </div>
            
            <p class="text-xs text-slate-400 text-center mt-4">
                La gráfica y los datos se actualizan de forma completamente automática todos los días.
            </p>
        </div>

    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        Rastreador automático conectado con GitHub Actions y Telegram.
    </footer>

</body>
</html>
