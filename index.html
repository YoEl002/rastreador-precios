<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Precios - Panasonic Lumix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-4 px-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📷</span>
                <h1 class="text-lg md:text-xl font-bold tracking-tight text-amber-400">Rastreador Lumix</h1>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Sistema Activo
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
            
            <h2 class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-1">Producto Monitoreado</h2>
            <p class="text-xl md:text-2xl font-bold text-white mb-4">Panasonic LUMIX (Amazon.es)</p>
            
            <div class="flex flex-wrap gap-4 items-center justify-between pt-4 border-t border-slate-800/80">
                <div class="text-xs text-slate-400">
                    🕒 Actualización automática diaria a las 10:00 UTC
                </div>
                <a href="https://www.amazon.es/dp/B01NCTOKPM" target="_blank" class="inline-flex items-center px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 transition-all shadow-md shadow-amber-500/20">
                    Ver en Amazon &rarr;
                </a>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-base font-semibold text-slate-200">📊 Evolución Histórica de Precios</h3>
            </div>
            
            <div class="flex justify-center items-center bg-slate-950/60 rounded-xl p-3 border border-slate-800/50 overflow-hidden">
                <img src="grafico_precios.png" alt="Gráfica de evolución de precios de la Lumix" class="w-full h-auto rounded-lg object-contain">
            </div>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Panel impulsado por GitHub Actions, Playwright y Python.</p>
    </footer>

</body>
</html>
