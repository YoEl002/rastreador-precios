name: Rastreador de Precios Automático

on:
  schedule:
    # Se ejecuta todos los días a las 10:00 UTC (12:00 hora de España)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib playwright

    - name: Instalar navegadores para Playwright
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Ejecutar el rastreador
      run: python rastreador.py

    - name: Guardar los cambios (CSV y Gráfica) en GitHub
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial de precios [Auto]" && git push)
