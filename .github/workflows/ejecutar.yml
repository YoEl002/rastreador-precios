name: Rastreador de Precios Automático

on:
  on:
  schedule:
    - cron: '0 * * * *' # Esto significa a los 0 minutos de cada hora
  workflow_dispatch: # Esto te deja mantener el botón de ejecución manual por si quieres probarlo

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib playwright requests

    - name: Instalar navegadores para Playwright
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Ejecutar el rastreador
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python rastreador.py

    - name: Subir y guardar archivos en el repositorio
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualización automática de precios y gráfica"
        file_pattern: "historial_precios.csv grafico_precios.png"
